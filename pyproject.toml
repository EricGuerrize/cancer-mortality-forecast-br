[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancer-mortality-forecast-br"
version = "0.1.0"
description = "Pipeline reproduzível de previsão de mortalidade por câncer por tipo e UF (Brasil) até 2030"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Eric Guerrize" }]
keywords = ["datasus", "sim", "ibge", "cancer", "mortalidade", "forecast"]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.1",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
sim = [
  # PySUS é GPL-3.0; usado apenas como dependência opcional de download.
  "pysus>=2.11",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[project.scripts]
cancer-mortality = "ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ingestion", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
